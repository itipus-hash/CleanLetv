plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        // LeTV X4-65S (DemeterUHD) runs Android 6.0 (SDK 23) and has no other launcher that
        // survives its firmware. The code uses no API above 23 unguarded (no NotificationChannel,
        // no RequiresApi), so the floor is lowered for this device. Raise it back to 26 for
        // general use.
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '2.6'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // LeTV X4-65S (DemeterUHD) is Android 6.0 (SDK 23), but the code uses java.time
        // (LocalDate, Instant, ZoneId, Duration), which only exists from API 26. Core library
        // desugaring rewrites those calls into java.util.Calendar / java.text equivalents, so the
        // launcher runs on API 23 without touching the feature code.
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Provides the backported java.time for API 23; only needed while minSdk is below 26.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
